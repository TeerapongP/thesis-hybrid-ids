input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP}"
    # pa5220.raw was removed on 2026-11-07. It carried raw PA-5220 firewall logs, which the
    # approved proposal (scope item 3.2) puts permanently out of scope -- the logs were never
    # obtained -- so nothing ever produced to it and soc-pa5220.raw-* was always empty.
    # Consuming a topic with no producer is not harmless: an empty index reads as "no traffic"
    # rather than "this was never built".
    #
    # pa5220.features and pa5220.ml_output went the same way on 2026-11-08, after checking
    # the other end as well: no src/ module publishes to either, AND no Kibana saved object
    # or Grafana panel reads soc-pa5220.features-* or soc-pa5220.ml_output-*. They were dead
    # at both ends, so producing to them would have built a path nothing consumes -- the same
    # reasoning HANDOFF_OUTPUT_LAYER.md already applied when it declined to mirror
    # pa5220.llm_output here. Every dashboard reads soc-alerts-*, which alert_dispatcher.py
    # writes directly.
    topics            => ["pa5220.enriched"]
    group_id          => "logstash-soc"
    codec             => json
    auto_offset_reset => "earliest"
    decorate_events   => "basic"
  }
}

filter {
  mutate {
    add_field => { "[@metadata][index]" => "soc-%{[@metadata][kafka][topic]}" }
  }
  date {
    match  => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
