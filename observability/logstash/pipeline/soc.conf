input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP}"
    # pa5220.raw was removed on 2026-11-07. It carried raw PA-5220 firewall logs, which the
    # approved proposal (scope item 3.2) puts permanently out of scope -- the logs were never
    # obtained -- so no component ever produced to it. soc-pa5220.raw-* is NOT empty, though:
    # it holds 14 documents, all hand-published test events from enrich.py's own live
    # verification (event_ids live-1..3, m-1..4). Checked on 2026-11-08; the note here
    # previously claimed the index was empty without anyone having looked.
    # Consuming a topic no component produces to is not harmless: the index reads as
    # "no traffic" rather than "this was never built".
    #
    # pa5220.features and pa5220.ml_output went the same way on 2026-11-08, after checking
    # the other end as well: no src/ module publishes to either, AND no Kibana saved object
    # or Grafana panel reads soc-pa5220.features-* or soc-pa5220.ml_output-*. They were dead
    # at both ends, so producing to them would have built a path nothing consumes -- the same
    # reasoning HANDOFF_OUTPUT_LAYER.md already applied when it declined to mirror
    # pa5220.llm_output here. Every dashboard reads soc-alerts-*, which alert_dispatcher.py
    # writes directly.
    topics            => ["pa5220.enriched"]
    group_id          => "logstash-soc"
    codec             => json
    auto_offset_reset => "earliest"
    decorate_events   => "basic"
  }
}

filter {
  mutate {
    add_field => { "[@metadata][index]" => "soc-%{[@metadata][kafka][topic]}" }
  }
  # Replay events from src/e2e_replay.py carry a `features` object of 94 model inputs, and
  # one of their names is "Fwd Header Length.1". Elasticsearch reads the dot as a path, so
  # it tries to make features."Fwd Header Length" an object while the sibling field of that
  # exact name is already a number, and rejects the whole document:
  #   400 can't merge a non object mapping [features.Fwd Header Length] with an object
  # Measured 2026-11-08: every replay event was dropped this way, into
  # soc-pa5220.enriched-2017.07.07, while the pipeline reported success because nothing in
  # it reads Elasticsearch back. A silent 400 is the worst failure shape available here.
  #
  # Serialised rather than dropped, so the Elasticsearch copy stays a faithful record of the
  # topic. Enrichment is deliberately additive and both topics must stay diffable, which a
  # removed field would break. One string field also costs one mapping instead of 94.
  if [features] {
    ruby {
      code => 'event.set("features_json", event.get("features").to_json); event.remove("features")'
    }
  }
  date {
    match  => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
