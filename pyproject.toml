[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "elasticsearch>=8.13.4,<9",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    # Only src/notifications/gmail_oauth_setup.py needs this: it performs the one-time
    # OAuth2 consent exchange that mints GMAIL_REFRESH_TOKEN. notify_gmail.py itself
    # refreshes an existing token with google-auth alone.
    "google-auth-oauthlib>=1.2.3",
    "influxdb-client>=1.50.0",
    "ipykernel>=7.3.0",
    "kafka-python>=2.2.15,<3",
    "langchain-core>=1.6.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "pika>=1.4.4",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.2.0",
]
